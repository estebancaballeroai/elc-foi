name: Pixel shared engine QA
on:
  push:
    branches: [experimental/pixel-engine-shared-v0-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check scripts
        run: |
          node --check pixel-lab/shared/engine.js
          node --check pixel-lab/stories/eden.js
          node --check pixel-lab/stories/noe.js
          node --check pixel-lab/stories/joseph.js
          node --check tests/pixel-shared-smoke.cjs
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run shared engine integration tests
        run: node tests/pixel-shared-smoke.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-shared-qa-screenshots
          path: pixel-lab-screenshots/
          if-no-files-found: ignore
